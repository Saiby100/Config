# --- General Settings ---
# Change the prefix key from Ctrl+b to Ctrl+a (closer to Home Row)
unbind C-b
set-option -g prefix C-Space
# Pressing the prefix again while already waiting re-arms the prefix table
# (switch-client -T prefix) instead of cancelling it — so a double-tap is a
# harmless no-op rather than dismissing the leader. NB: this gives up the
# default send-prefix behavior needed for nested tmux sessions.
bind-key C-Space switch-client -T prefix

# Ensure 256-color support inside tmux (critical for Neovim themes).
# Use tmux-256color, not screen-256color: the legacy screen terminfo
# under-describes tmux's cursor/wrap/clear-line capabilities, which makes
# in-place-redrawing TUIs (Claude Code's spinner/status/prompt) overlap or
# leave leftover characters. tmux-256color reports tmux accurately.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Let applications pass escape sequences through to the outer terminal
# (avoids rendering artifacts for apps that emit passthrough sequences).
set -g allow-passthrough on

# Enable extended (CSI u) key reporting so the S-Enter binding below is reliable.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Enable mouse support (clicking, resizing panes, scrolling)
set -g mouse on

# Drag a window along the status bar to reorder it — tmux ships no default for
# this. MouseDrag1Status fires on every motion event with -t= resolving to the
# window under the cursor, so the swap happens step by step as the cursor
# crosses each neighbour. The pane is marked on press (in addition to the
# default switch-client) purely to pin swap-window's source: with a marked pane
# present swap-window takes the marked window as the source, and the mark
# travels with the window, so the grabbed window keeps being the one that moves.
# Without the mark the source is the current window, which drifts as the swaps
# land and the drag turns into a no-op. -d keeps the active window from jumping
# to each slot mid-drag; the release and plain-click bindings clear the mark.
bind-key -n MouseDown1Status { switch-client -t= ; select-pane -m }
bind-key -n MouseDrag1Status swap-window -d -t=
bind-key -n MouseDragEnd1Status select-pane -M
bind-key -n MouseUp1Status select-pane -M

# Pass focus events to applications (lets Neovim detect pane switches)
set -g focus-events on

# Start window and pane indexing at 1 instead of 0 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Decrease command delay for faster response (stops Vim mode-switch lag)
set -s escape-time 0

# Allow Shift+Enter to pass through to applications (e.g. Claude Code newline)
bind-key -n S-Enter send-keys Escape "[13;2u"

# --- Vim Style Split & Navigation ---
# Split panes using | and - (more intuitive)
unbind '"'
unbind %
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Open the new pane *before* the current one (-b): + to the left, _ above
bind + split-window -h -b -c "#{pane_current_path}"
bind _ split-window -v -b -c "#{pane_current_path}"

# Navigate panes using Vim directions (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Vim keys in Copy Mode (scrolling through agent logs)
setw -g mode-keys vi
bind v copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Send copies to the macOS pasteboard so they share one register with
# Neovim's clipboard=unnamedplus (the + register). Without piping to pbcopy,
# tmux keeps yanks in its own buffer and Neovim never sees them.
set -g set-clipboard on
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- Window Naming ---
# Auto-name windows after the pane's current directory (basename) instead of
# the running command — "Config" or "hydra" beats "zsh" or "node". Windows
# renamed by hand keep their name (tmux disables auto-rename per-window).
set -g automatic-rename-format '#{b:pane_current_path}'

# --- New Window ---
# Ask for a name up front. Windows auto-named after their directory are
# indistinguishable once two of them sit in the same repo, and an unnamed
# window is exactly the one you forget is already open.
#
# Skipping the prompt has to fall back, and it does not fall back by itself:
# `new-window -n ''` leaves the name empty AND turns automatic-rename off, so
# the window keeps a blank label forever. Turning automatic-rename back on when
# the name came back empty hands it to automatic-rename-format, i.e. the
# directory basename. A name that *was* typed leaves automatic-rename off, so
# it sticks rather than being overwritten on the next cd.
bind c command-prompt -p "Window name:" \
  "new-window -c '#{pane_current_path}' -n '%%' ; if-shell -F '#{==:#{window_name},}' 'set -w automatic-rename on'"

# --- Sessions ---
# Create a new session, prompting for its name (tmux has no default key for this)
bind C command-prompt -p "New session name:" "new-session -s '%%'"

# No session-only picker: prefix + w below lists sessions, windows and panes in
# one tree and fuzzy-matches across all three, so a separate `s` bound to
# choose-tree -Zs was the same list with two thirds of it hidden. Unbound
# rather than deleted: sourcing this file does not clear bindings it no longer
# mentions, so a plain deletion left the old key alive until the next server.
unbind s

# --- The Tree Popup ---
# The everyday "what have I already got open?" key, and the one interface for
# acting on any of it: ~/.config/tmux/tree.sh in an fzf popup, listing every
# session, window and pane in the server as a tree.
#
# This replaced choose-tree, which is why choose-tree appears nowhere in this
# file any more. choose-tree can draw the hierarchy but cannot match into it,
# so finding a pane meant scrolling past the ones you were not looking for,
# and its row format had to be fought into shape twice (the old -F here ran to
# 300 characters). fzf matches session name, window name, pane title and path
# at once, incrementally, and the hotkeys act on the row already under the
# cursor — so create, rename and kill stopped needing bindings of their own.
#
# It also owns moving things around now. m marks the row under the cursor, M
# drops everything marked into the row you have moved to: panes into that
# row's window, windows into that row's session. Every row carries an icon
# saying which of the three it is, so a window and a pane no longer read the
# same at a glance. Searching adds a column naming each row's session and
# window, since a filtered list has no tree left to read that off — and the
# search matches it, so "mrm claude" finds the Claude pane in the MRM window.
#
# Keys inside the popup: enter jumps, m mark, M move marked here, U unmark
# all, n new, r rename, x kill, h/l fold, j/k move, p or ? toggles the
# preview, i or / searches. The current session opens expanded, the rest
# collapsed.
#
# -E closes the popup when the script exits; without it the popup outlives the
# command and has to be dismissed by hand. The 80% box leaves the status bar
# and the surrounding panes visible, which is the context the list is about.
bind w display-popup -E -w 80% -h 80% "~/.config/tmux/tree.sh"

# --- Quick Reload ---
# Reload config file easily with Prefix + r
bind r source-file ~/.tmux.conf \; display "tmux config reloaded!"


# --- Resize Panes ---
set -g repeat-time 1000
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Fullscreen Pane ---
bind m resize-pane -Z

# --- Swap Panes ---
# Prompt for a pane index and swap the focused pane with it. The indexes are
# already on screen — pane-border-format prints #P in every border — so the
# prompt has nothing to reveal first.
#
# -d reads backwards here: it means "don't change the active pane", i.e. keep
# focus on *this* pane, which rides along to the new slot. Without it tmux
# leaves focus at the old position and you land in the pane that swapped in.
bind S command-prompt -p "Swap with pane:" "swap-pane -d -t '%%'"

# --- Close Pane ---
bind-key -n C-q confirm-before -p "kill-pane #P? (y/n)" kill-pane

# --- Moving Panes and Windows ---
# Grab (g) and send (G) are gone: both opened the same tree popup as prefix + w
# with a different verb on enter, and each could move exactly one pane, always
# to or from the pane you happened to be in. The popup does it with marks now —
# m on every row you want, then M on the destination — which says both ends
# outright, moves any number at once, and moves windows as well as panes. Two
# bindings and two modes for a worse version of one key was not worth keeping.
#
# Unbound rather than deleted, for the reason given above bind w: sourcing this
# file does not clear bindings it no longer mentions, so a plain deletion would
# leave the old keys alive, still calling tree.sh with a mode argument it no
# longer understands.
unbind g
unbind G

# Pop the current pane back out into its own window. The counterpart to marking
# a pane and moving it somewhere, for when "somewhere" is nowhere in particular.
bind b break-pane

# --- Palette ---
# onedark, matching the Neovim theme and ghostty's "One Double Dark". Defined
# as user options so every colour below has one source of truth; tmux expands
# #{@name} inside style options too, not just status-left/right.
set -g @bg     "#282c34"   # editor background
set -g @bg_alt "#3e4452"   # visual grey — raised surfaces (active tab, clock)
set -g @fg     "#aab2bf"
set -g @muted  "#5c6370"   # comment grey — inactive text
set -g @blue   "#61afef"
set -g @green  "#98c379"
set -g @yellow "#e5c07b"
set -g @red    "#e06c75"

# --- Status Bar ---
# Hand-rolled rather than themed by a plugin. The tmux-onedark-theme plugin
# this replaced was last updated in 2020 and set option names removed in tmux
# 2.9 (message-fg, pane-border-fg, window-status-fg, status-right-attr, …).
# It wrote them with `set -gq`, so on modern tmux half of it failed silently
# and the rest had to be undone by hand further down this file.
#
# Sits at the top: Neovim's lualine owns the bottom row of every editor pane,
# so a bottom tmux bar stacks into one noisy block.
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#{@bg},fg=#{@muted}"
set -g status-justify left

# Left: session name in a rounded cap. Doubles as the prefix-pending
# indicator — while tmux has swallowed the prefix and is waiting on the
# secondary key, the cap turns yellow and reads LEADER, then reverts once the
# next key lands (or it times out). client_prefix is only true in that window.
#
# Trailing ·N inside the cap is how many sessions the server is holding —
# sessions are cheap to spawn from the prefix + w tree and easy to forget about.
# It rides the #S branch only, so the LEADER swap still reads as just LEADER.
# Hidden entirely at one session, for the same reason the Claude dot is hidden
# on the current window: a count you already know tells you nothing.
set -g status-left-length 44
set -g status-left "#[fg=#{?client_prefix,#{@yellow},#{@blue}},bg=#{@bg}]#[fg=#{@bg},bg=#{?client_prefix,#{@yellow},#{@blue}},bold] #{?client_prefix,LEADER,#S#{?#{>:#{server_sessions},1},·#{server_sessions},}} #[fg=#{?client_prefix,#{@yellow},#{@blue}},bg=#{@bg}] "

# Windows: inactive sit flat on the background, the active one is raised onto
# @bg_alt with a blue index. #{?window_zoomed_flag,…} marks a zoomed pane
# (prefix + m) — otherwise zoom is invisible until you notice the missing panes.
#
# Inactive windows also carry a Claude Code state dot, set by
# ~/.claude/tmux-claude-state.sh off Claude's hooks:
#   yellow — Claude is blocked on you (permission prompt, or idle)
#   green  — Claude finished its turn
# Deliberately absent from window-status-current-format: a dot on the window
# you're already looking at tells you nothing. See after-select-window below.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@muted}] #I #W#{?window_zoomed_flag, 󰊓,} #{?#{==:#{@claude_state},waiting},#[fg=#{@yellow}]● ,#{?#{==:#{@claude_state},done},#[fg=#{@green}]● ,}} "
set -g window-status-current-format "#[fg=#{@bg_alt},bg=#{@bg}]#[fg=#{@blue},bg=#{@bg_alt},bold] #I #[fg=#{@fg},nobold]#W#{?window_zoomed_flag, 󰊓,} #[fg=#{@bg_alt},bg=#{@bg}]"

# Right: the active pane's directory, the Tailscale glyph, then the clock in a
# raised cap. The substitution rewrites the home prefix to ~ so the path fits —
# tmux formats don't expand $HOME, so the literal path is unavoidable here.
#
# tailscale-status.sh prints the VPN glyph already coloured (green up / grey
# down / red daemon unreachable); it resolves the palette itself so this stays
# a single #() call. `ts` refreshes the client on toggle, so the glyph does not
# wait out the 5s status-interval.
set -g status-right-length 70
set -g status-right "#[fg=#{@muted}]#{s|^/Users/salahuddin|~|:pane_current_path} #(~/.config/tmux/tailscale-status.sh) #[fg=#{@bg_alt},bg=#{@bg}]#[fg=#{@fg},bg=#{@bg_alt}] %H:%M #[fg=#{@bg_alt},bg=#{@bg}]"

# Switching to a window means you've seen whatever Claude wanted, so drop its
# dot. Without this the state would persist until the next prompt submission
# and the dot would reappear the moment you switched away again.
set-hook -g after-select-window 'set-option -uw @claude_state'

# Remaining surfaces the old theme was supposed to cover.
set -g message-style "fg=#{@bg},bg=#{@yellow},bold"
set -g message-command-style "fg=#{@bg},bg=#{@yellow},bold"
set -g mode-style "fg=#{@bg},bg=#{@yellow}"
# These two take a bare colour rather than a style, and colour options are not
# format-expanded — so the palette vars above can't be used here.
set -g display-panes-colour "#61afef"        # @blue
set -g display-panes-active-colour "#e5c07b" # @yellow

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

# --- Active Pane Indicator ---
# No border arrows — the active pane is distinguished by its border colour
# (pane-active-border-style below) instead.
set -g pane-border-indicators off

# Each pane's index in its border, plus the pane title when something has set
# one. Claude Code keeps its title updated with a live status, so in a split
# layout the border doubles as a per-pane progress line. tmux defaults the
# title to the hostname, so that case is suppressed as noise.
set -g pane-border-status top
set -g pane-border-format " #P#{?#{==:#{pane_title},#{host}},, · #{pane_title}} "
set -g pane-border-style "fg=#{@bg_alt}"

# Give the *active* pane a distinct background — a subtle dark blue tinted
# toward onedark's blue (#61afef). Dimming inactive panes via window-style is
# the more common approach but only dulls default-coloured text: syntax
# highlighting and other explicit colours stay bright, so the cue is
# inconsistent. A background applies to every cell, so the focused pane stands
# out regardless of how its text is coloured.
set -g window-style        "default"
set -g window-active-style "bg=#283040"

# --- Mode-Aware Active Border ---
# Recolor the active pane's border by the state it's in, so the mode is
# obvious at a glance. Checked in priority order:
#   copy/view mode (pane_in_mode) → yellow
#   synchronize-panes broadcast   → red  (typing hits every pane — treat as a warning)
#   otherwise (normal)            → green
set -g pane-active-border-style "#{?pane_in_mode,fg=#{@yellow},#{?synchronize-panes,fg=#{@red},fg=#{@green}}}"

# Bootstrap plugins on a fresh machine. tpm does NOT auto-fetch declared
# plugins — it only installs on demand (prefix + I), so without this a rebuilt
# Mac comes up with the config sourced but no plugin bindings (e.g. the
# vim-tmux-navigator C-h/j/k/l pane navigation silently missing). Two steps:
#   1. clone tpm itself if its dir is absent
#   2. install all declared plugins if any are missing — checked via the
#      navigator dir, the plugin we most depend on for navigation
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
if "test ! -d ~/.tmux/plugins/vim-tmux-navigator" \
   "run '~/.tmux/plugins/tpm/bin/install_plugins'"
